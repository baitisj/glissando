name: Build and test

# Each PR gets the quick modem build and tests. The app build runs only
# when started by hand: Actions > Build and test > Run workflow, which runs
# both jobs. Jeff chose this on 2026-10-22, since threads build and test
# before every push.
on:
  pull_request:
  workflow_dispatch:

jobs:
  modem:
    name: C++ modem
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        cmake -S modem -B build-modem -DUNITTEST=ON
        cmake --build build-modem -j$(nproc)
    - name: Test
      run: ctest --test-dir build-modem --output-on-failure

  app:
    name: App (Linux, PulseAudio)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git autoconf automake libtool \
          libwxgtk3.2-dev libpulse-dev libspeexdsp-dev libsndfile1-dev libhamlib-dev \
          libasound2-dev libao-dev libgsm1-dev libssl-dev
    - name: Build
      run: |
        cmake -S app -B build -DCMAKE_BUILD_TYPE=Release -DUSE_NATIVE_AUDIO=1 -DUNITTEST=ON
        cmake --build build -j$(nproc)
    - name: Test
      run: ctest --test-dir build -R "glissando|text_messaging" --output-on-failure
