name: Build and test

# Each PR gets the quick modem build and tests. The rest runs only when
# started by hand: Actions > Build and test > Run workflow, which runs the
# modem and app tests and builds the release AppImage, Windows zip and
# macOS zips, kept as the run's artifacts. Jeff chose this on 2026-10-22, since
# threads build and test before every push.
on:
  pull_request:
  workflow_dispatch:

jobs:
  modem:
    name: C++ modem
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        cmake -S modem -B build-modem -DUNITTEST=ON
        cmake --build build-modem -j$(nproc)
    - name: Test
      run: ctest --test-dir build-modem --output-on-failure

  app:
    name: App (Linux, PulseAudio)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git autoconf automake libtool \
          libwxgtk3.2-dev libpulse-dev libspeexdsp-dev libsndfile1-dev libhamlib-dev \
          libasound2-dev libao-dev libgsm1-dev libssl-dev
    - name: Build
      run: |
        cmake -S app -B build -DCMAKE_BUILD_TYPE=Release -DUSE_NATIVE_AUDIO=1 -DUNITTEST=ON
        cmake --build build -j$(nproc)
    - name: Test
      run: ctest --test-dir build -R "glissando|text_messaging" --output-on-failure

  appimage:
    name: Linux AppImage (built on Ubuntu 22.04)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: app/appimage/make-appimage-jammy.sh
    - name: Checksum
      run: |
        cd app/appimage
        sha256sum Glissando-*.AppImage | tee -a "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      with:
        name: glissando-appimage
        path: app/appimage/Glissando-*.AppImage
        if-no-files-found: error

  windows:
    name: Windows zip (MinGW-w64 cross build)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-mingw-w64-x86-64-posix libltdl-dev autoconf automake libtool zip
    - name: Build
      run: app/windows/make-zip.sh
    - name: Checksum
      run: |
        cd app/windows
        sha256sum Glissando-*.zip | tee -a "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      with:
        name: glissando-windows-x86_64
        path: app/windows/Glissando-*.zip
        if-no-files-found: error

  macos:
    # The macOS app, zipped, for Apple Silicon and Intel: wxWidgets (Cocoa),
    # Hamlib, libsndfile and libsamplerate built statically, the app's tests
    # run, signed ad hoc. The recipe follows Tim Vetter's macOS port of
    # Ragtime.
    name: macOS zip (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: arm64
          runner: macos-15
        - arch: x86_64
          runner: macos-15-intel
    steps:
    - uses: actions/checkout@v4
    - name: Install packages
      run: brew install autoconf automake libtool
    - name: Build, test and zip
      run: app/macos/make-zip.sh
    - name: Checksum
      run: |
        cd app/macos
        shasum -a 256 Glissando-*.zip | tee -a "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      with:
        name: glissando-macos-${{ matrix.arch }}
        path: app/macos/Glissando-*.zip
        if-no-files-found: error
